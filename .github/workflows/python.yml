  notify:
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: success()

    steps:
    - name: Update status
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          **${{ github.event_name == 'pull_request' }} ${{ github.event_name }}** in **${{ github.repository }}**
          **${{ github.actor }}**
          Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}
          Branch: <code>${{ github.ref }}</code>
          ${{ github.event.pull_request && format('https://github.com/{0}/pull/{1}">PR #{1}: {2}', github.repository, github.event.pull_request.number, github.event.pull_request.title) }}
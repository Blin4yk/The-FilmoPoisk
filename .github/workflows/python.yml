name: Telegram Notification

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # ручной запуск

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send telegram message
        uses: appleboy/telegram-action@v1.0.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ✅ Workflow completed!
          format: markdown
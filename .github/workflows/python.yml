name: tg-notify

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Debug secrets availability
      run: |
        echo "Token length: ${#TELEGRAM_BOT_TOKEN}"
        echo "Chat ID length: ${#TELEGRAM_CHAT_ID}"
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: Check secrets existence
      run: |
        echo "Token: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'exists' || 'MISSING' }}"
        echo "Chat ID: ${{ secrets.TELEGRAM_CHAT_ID != '' && 'exists' || 'MISSING' }}"

    - name: Send Telegram
      uses: appleboy/telegram-action@v0.1.1
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: CI/CD настроен
services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "${REDIS_EXTERNAL_PORT:-}:${REDIS_INTERNAL_PORT:-6379}"
    volumes:
      - ./redisdata:/data
    stdin_open: true

  postgres-benchmark:
    image: postgres:17
    container_name: postgres-benchmark
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_benchmark_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db


  elasticsearch-with-dump:
    image: elasticsearch:8.13.0
    container_name: elasticsearch-with-dump
    environment:
      - node.name=elasticsearch-with-dump
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms200m -Xmx200m
    volumes:
      - es-data01:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_EXTERNAL_PORT:-}:${ELASTICSEARCH_INTERNAL_PORT:-9200}"
    stdin_open: true

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch-with-dump

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-with-dump:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-with-dump

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

  sentry-postgres:
    image: postgres:17
    container_name: sentry-postgres
    environment:
      POSTGRES_PASSWORD: sentry
      POSTGRES_USER: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data

  sentry:
    image: getsentry/sentry:24.1.0
    container_name: sentry
    depends_on:
      - sentry-postgres
      - redis
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: ["run", "web"]
    ports:
      - "9000:9000"

  sentry-worker:
    image: getsentry/sentry:24.1.0
    depends_on:
      - sentry
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: ["run", "worker"]

  sentry-cron:
    image: getsentry/sentry:24.1.0
    depends_on:
      - sentry
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: ["run", "cron"]

  fastapi:
    build:
      context: ..
      dockerfile: ./Dockerfile
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ../src:/app
    working_dir: /app
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8000
    depends_on:
      - elasticsearch-with-dump
      - redis
      - kafka
      - postgres-benchmark
      - mongo
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MONGO_HOST=mongo
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/openapi" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:latest
    volumes:
      - ../nginx/configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/configs:/etc/nginx/site.conf:ro
    depends_on:
      - fastapi
    ports:
      - "${NGINX_EXTERNAL_PORT:-}:${NGINX_INTERNAL_PORT:-80}"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=

  etl-user-events:
    build:
      context: ..
      dockerfile: ./Dockerfile
    depends_on:
      - kafka
      - clickhouse
    volumes:
      - ../src:/app
    working_dir: /app
    command: python -m etl.kafka_to_clickhouse
    environment:
      - PYTHONPATH=/app

volumes:
  es-data01:
    driver: local
  mongo_data:
  postgres_benchmark_data:
  sentry_postgres_data:

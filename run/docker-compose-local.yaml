services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    stdin_open: true

  postgres-benchmark:
    image: postgres:16-alpine
    container_name: postgres-benchmark
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_benchmark_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  elasticsearch-with-dump:
    image: elasticsearch:8.13.0
    container_name: elasticsearch-with-dump
    environment:
      - node.name=elasticsearch-with-dump
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms200m -Xmx200m
    volumes:
      - es-data01:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    stdin_open: true

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./elk/logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch-with-dump

  kibana:
    image: kibana:8.13.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-with-dump:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-with-dump

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.0
    container_name: filebeat
    user: root
    command: [ "filebeat", "-e", "--strict.perms=false" ]
    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash

  sentry-postgres:
    image: postgres:16-alpine
    container_name: sentry-postgres
    environment:
      POSTGRES_PASSWORD: sentry
      POSTGRES_USER: sentry
      POSTGRES_DB: sentry
    volumes:
      - sentry_postgres_data:/var/lib/postgresql/data

  sentry:
    image: getsentry/sentry:24.1.0
    container_name: sentry
    depends_on:
      - sentry-postgres
      - redis
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: [ "run", "web" ]
    ports:
      - "9000:9000"

  sentry-worker:
    image: getsentry/sentry:24.1.0
    depends_on:
      - sentry
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: [ "run", "worker" ]

  sentry-cron:
    image: getsentry/sentry:24.1.0
    depends_on:
      - sentry
    environment:
      SENTRY_SECRET_KEY: ${SENTRY_SECRET_KEY:-please-change-me}
      SENTRY_POSTGRES_HOST: sentry-postgres
      SENTRY_DB_USER: sentry
      SENTRY_DB_PASSWORD: sentry
      SENTRY_REDIS_HOST: redis
    command: [ "run", "cron" ]

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    working_dir: /app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    depends_on:
      - kibana
      - elasticsearch-with-dump
      - redis
      - jaeger
      - kafka
      - postgres-benchmark
      - mongo
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
      - SENTRY_DSN=${SENTRY_DSN:-}
      - MONGO_HOST=mongo
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/openapi" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:latest
    volumes:
      - ../nginx/configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/configs:/etc/nginx/site.conf:ro
    depends_on:
      - fastapi
    ports:
      - "${NGINX_EXTERNAL_PORT:-}:${NGINX_INTERNAL_PORT:-80}"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "no"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_NAME=kraft

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    ports:
      - "8123:8123"
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=user
      - CLICKHOUSE_PASSWORD=12345

  etl-user-events:
    build:
      context: ..
      dockerfile: ./Dockerfile
    depends_on:
      - kafka
      - clickhouse
    volumes:
      - ../src:/app
    working_dir: /app
    command: python -m etl.kafka_to_clickhouse
    environment:
      - PYTHONPATH=/app

  tests:
    build:
      context: ..
      dockerfile: ./Dockerfile.test
    environment:
      - API_URL=http://fastapi:8000/api/v1
      - ELASTICSEARCH_URL=http://elasticsearch-with-dump:9200
      - REDIS_URL=redis://redis:6379
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./test-reports:/app/test-reports
    command:
      - sh
      - -c
      - |
        echo "Waiting for services..."
        python tests/scripts/wait_for_services.py
        python tests/scripts/load_test_data.py
        pytest tests/functional/ -v --junitxml=test-reports/results.xml

volumes:
  es-data01:
    driver: local
  postgres_data:
    driver: local
  kafka_data:
  mongo_data:
  postgres_benchmark_data:
  sentry_postgres_data:


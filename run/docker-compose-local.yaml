services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    stdin_open: true

  elasticsearch-with-dump:
    image: elasticsearch:8.13.0
    container_name: elasticsearch-with-dump
    environment:
      - node.name=elasticsearch-with-dump
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms200m -Xmx200m
    volumes:
      - es-data01:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    stdin_open: true

  kibana-with-dump:
    image: kibana:8.13.0
    container_name: kibana-with-dump
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-with-dump:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch-with-dump

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "16686:16686"  # Jaeger UI
    restart: unless-stopped

  fastapi:
    build:
      context: ..
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app
    working_dir: /app
    command: fastapi dev main.py --host 0.0.0.0 --port 8000
    depends_on:
      - kibana-with-dump
      - elasticsearch-with-dump
      - redis
      - jaeger
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/openapi" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:latest
    volumes:
      - ../nginx/configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/configs:/etc/nginx/site.conf:ro
    depends_on:
      - fastapi
    ports:
      - "${NGINX_EXTERNAL_PORT:-}:${NGINX_INTERNAL_PORT:-80}"

  tests:
    build:
      context: ..
      dockerfile: ./Dockerfile.test
    environment:
      - API_URL=http://fastapi:8000/api/v1
      - ELASTICSEARCH_URL=http://elasticsearch-with-dump:9200
      - REDIS_URL=redis://redis:6379
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./test-reports:/app/test-reports
    command:
      - sh
      - -c
      - |
        echo "Waiting for services..."
        python tests/scripts/wait_for_services.py
        python tests/scripts/load_test_data.py
        pytest tests/functional/ -v --junitxml=test-reports/results.xml

volumes:
  es-data01:
    driver: local
  postgres_data:
    driver: local
